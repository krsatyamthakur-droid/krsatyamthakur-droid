<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Animated developer workstation illustration">
<title>Satyam Kumar - developer workstation</title>
<style>
  .b    { fill:#14224A; stroke:#4D9BFF; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
  .b2   { fill:#1B2E5E; stroke:#4D9BFF; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
  .s    { fill:#0A1530; stroke:#4D9BFF; stroke-width:3.5; stroke-linejoin:round; }
  .w    { fill:none;    stroke:#4D9BFF; stroke-width:4;   stroke-linecap:round; stroke-linejoin:round; }
  .thin { fill:none;    stroke:#4D9BFF; stroke-width:3;   stroke-linecap:round; }
  .hair { fill:none;    stroke:#4D9BFF; stroke-width:2;   stroke-linecap:round; opacity:.65; }
  .d    { fill:#FF4756; }
  .dim  { fill:#FF4756; opacity:.5; }
  .red  { fill:#FF4756; }
  .teal { fill:#4D9BFF; }
  .wht  { fill:#EAF0FF; }
  .txt  { fill:#FF4756; font-family:'Fira Code','SF Mono',Menlo,monospace; font-weight:700; }

  /* ---- data flowing through the cables ---- */
  .flow { fill:none; stroke:#FF4756; stroke-width:4; stroke-linecap:round;
          stroke-dasharray:16 190; animation:flow 3.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-412; } }
  .f1{animation-delay:0s}.f2{animation-delay:.4s}.f3{animation-delay:.8s}.f4{animation-delay:1.2s}
  .f5{animation-delay:1.6s}.f6{animation-delay:2s}.f7{animation-delay:2.4s}.f8{animation-delay:2.8s}

  /* ---- blinking status LEDs ---- */
  .bl  { animation:bl 2.2s ease-in-out infinite }
  .bl2 { animation:bl 2.2s ease-in-out infinite; animation-delay:.55s }
  .bl3 { animation:bl 2.2s ease-in-out infinite; animation-delay:1.1s }
  .bl4 { animation:bl 2.2s ease-in-out infinite; animation-delay:1.65s }
  @keyframes bl { 0%,100%{opacity:1} 50%{opacity:.18} }

  /* ---- spinning parts ---- */
  .spin  { transform-box:fill-box; transform-origin:center; animation:sp 3.6s linear infinite }
  .spinS { transform-box:fill-box; transform-origin:center; animation:sp 9s linear infinite }
  @keyframes sp { to { transform:rotate(360deg) } }

  /* ---- code typing + cursor ---- */
  .type { transform-box:fill-box; transform-origin:left center; animation:ty 4.4s steps(14) infinite }
  @keyframes ty { 0%{transform:scaleX(.04)} 70%,100%{transform:scaleX(1)} }
  .cur  { animation:cur 1s steps(1) infinite }
  @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ---- equaliser bars ---- */
  .eq { transform-box:fill-box; transform-origin:bottom; animation:eq 1.1s ease-in-out infinite alternate }
  @keyframes eq { from{transform:scaleY(.28)} to{transform:scaleY(1)} }
  .e1{animation-delay:0s}.e2{animation-delay:.15s}.e3{animation-delay:.3s}.e4{animation-delay:.45s}.e5{animation-delay:.6s}

  /* ---- steam ---- */
  .stm { animation:stm 3s ease-in-out infinite; opacity:0 }
  @keyframes stm { 0%{opacity:0;transform:translateY(6px)} 35%{opacity:.75} 100%{opacity:0;transform:translateY(-22px)} }
  .s2{animation-delay:1s}.s3{animation-delay:2s}

  /* ---- lens breathing ---- */
  .lens { transform-box:fill-box; transform-origin:center; animation:ln 4s ease-in-out infinite }
  @keyframes ln { 0%,100%{transform:scale(1)} 50%{transform:scale(.82)} }
</style>

<defs>
  <radialGradient id="glow" cx="50%" cy="46%" r="62%">
    <stop offset="0%"  stop-color="#1B3266"/>
    <stop offset="100%" stop-color="#080F24"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#4D9BFF" stroke-width="1" opacity=".05"/>
  </pattern>
  <!-- cable geometry, drawn once and re-used for the flowing pulse -->
  <path id="wA" d="M250 250 C 330 250, 320 175, 400 175"/>
  <path id="wB" d="M470 300 C 540 300, 560 400, 620 420"/>
  <path id="wC" d="M600 240 C 600 300, 620 330, 660 360"/>
  <path id="wD" d="M660 180 C 700 180, 690 250, 700 260"/>
  <path id="wE" d="M930 205 C 1000 205, 1000 150, 1060 150 L 1180 150 C 1240 150, 1240 200, 1240 285"/>
  <path id="wF" d="M1140 290 C 1200 290, 1230 250, 1290 250"/>
  <path id="wG" d="M1330 330 C 1380 330, 1380 250, 1440 250"/>
  <path id="wH" d="M1000 470 C 1080 470, 1090 490, 1160 490"/>
  <path id="wI" d="M200 485 L 250 485"/>
  <path id="wJ" d="M380 485 C 480 485, 520 470, 620 470"/>
  <path id="wK" d="M620 540 C 560 540, 560 600, 500 600"/>
  <path id="wL" d="M1000 545 C 1060 545, 1080 620, 1140 620"/>
  <path id="wM" d="M1440 540 C 1440 600, 1420 620, 1420 640"/>
  <path id="wN" d="M1060 745 C 1120 745, 1150 720, 1180 720"/>
  <path id="wO" d="M1280 490 L 1320 490"/>
</defs>

<rect x="0" y="0" width="1600" height="800" fill="url(#glow)"/>
<rect x="0" y="0" width="1600" height="800" fill="url(#grid)"/>

