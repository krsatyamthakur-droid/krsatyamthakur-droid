<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Developer workstation illustration">
<style>
  .bg   { fill:#141B2D; }
  .b    { fill:#1B2440; stroke:#F4C542; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
  .s    { fill:#0E1424; stroke:#F4C542; stroke-width:3.5; stroke-linejoin:round; }
  .w    { fill:none;    stroke:#F4C542; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  .thin { fill:none;    stroke:#F4C542; stroke-width:3; stroke-linecap:round; }
  .d    { fill:#F4C542; }
  .red  { fill:#E5484D; }
  .teal { fill:#35C4B5; }
  .wht  { fill:#F2F5FF; }
  .txt  { fill:#F4C542; font-family:'Fira Code','SF Mono',monospace; font-weight:700; }
  .blink { animation:bl 2.4s ease-in-out infinite; }
  .blink2{ animation:bl 2.4s ease-in-out infinite; animation-delay:.8s; }
  .blink3{ animation:bl 2.4s ease-in-out infinite; animation-delay:1.6s; }
  @keyframes bl { 0%,100%{opacity:1} 50%{opacity:.25} }
  .spin { transform-origin:center; animation:sp 6s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg) } }
</style>

